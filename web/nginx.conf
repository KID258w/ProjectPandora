# Pandora Web 管理端 + 反向代理
# - /            静态文件（Vue SPA，history 模式回落到 index.html）
# - /static/     Django 静态文件（admin 样式等），来自 backend 的 collectstatic 卷
# - /media/      用户上传附件，来自持久化数据卷
# - /api/ /admin/ 反向代理到 backend:8000
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端口令/附件上限 10MB，留一点余量
    client_max_body_size 12m;

    # 容器内服务名在启动时解析一次就缓存，backend 换了 IP 会 502；
    # 用变量 + Docker 内置 DNS 强制每 10s 重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /data/media/;
        expires 7d;
        access_log off;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django Admin 与文档（Swagger/ReDoc）也由后端提供
    location /admin/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
