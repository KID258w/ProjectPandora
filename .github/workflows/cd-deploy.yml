name: CD Deploy

# 自动部署链路：合并到 main → 构建后端/Web 镜像 → 推送 GHCR → SSH 到服务器
# 拉取新镜像并重启 → 健康检查（失败自动回滚上一个健康版本）。
# 手动补发：Actions → CD Deploy → Run workflow（可选任意分支/ref）。
#
# 需要的 Secrets（Settings → Secrets and variables → Actions）：
#   SSH_HOST / SSH_USER / SSH_KEY / SSH_PORT(可选,默认22)
#   GHCR_PULL_USER / GHCR_PULL_TOKEN(可选：包为私有仓库时必须)
# 需要的 Variables：
#   DEPLOY_PATH(默认 /opt/pandora) / WEB_PORT(默认 80) / APP_URL / VITE_API_BASE_URL(留空=同域)
# 服务器首次准备见 docs/cicd/server-deploy.md

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'deploy/**'
      - '.github/workflows/cd-deploy.yml'
  workflow_dispatch:

concurrency:
  # 部署必须串行，避免两个 run 同时 compose up 互相覆盖
  group: cd-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write        # 推送镜像到 ghcr.io

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算镜像标签
        id: meta
        run: |
          # GHCR 镜像名必须全小写，而仓库名 ProjectPandora 含大写
          repo="${GITHUB_REPOSITORY,,}"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${repo}/backend" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${repo}/web" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend_image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 构建并推送 Web 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          # 留空 = 前端请求相对路径 /api/v1/...，由 Nginx 反代（同域部署）
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web_image }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: 部署到服务器
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 上传 Compose 与部署脚本
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/remote-deploy.sh,deploy/remote-rollback.sh,deploy/.env.example"
          target: ${{ vars.DEPLOY_PATH || '/opt/pandora' }}
          strip_components: 1
          # 脚本换行符必须是 LF，否则服务器上报 bad interpreter
          overwrite: true

      - name: 拉取镜像并重启服务
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          WEB_PORT: ${{ vars.WEB_PORT || '80' }}
          GHCR_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          envs: IMAGE_TAG,BACKEND_IMAGE,WEB_IMAGE,WEB_PORT,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH || '/opt/pandora' }}"
            chmod +x remote-deploy.sh remote-rollback.sh
            ./remote-deploy.sh

      - name: 部署结果摘要
        if: always()
        run: |
          {
            echo "## 部署结果"
            echo ""
            echo "- 镜像标签：\`${{ needs.build.outputs.tag }}\`"
            echo "- 后端镜像：\`${{ needs.build.outputs.backend_image }}:${{ needs.build.outputs.tag }}\`"
            echo "- Web 镜像：\`${{ needs.build.outputs.web_image }}:${{ needs.build.outputs.tag }}\`"
            echo "- 访问地址：${{ vars.APP_URL || '未配置 APP_URL 变量' }}"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "❌ 失败：服务器端已自动尝试回滚到上一个健康版本。"
              echo "排查步骤见 docs/cicd/server-deploy.md 的「故障排查」一节。"
            else
              echo "✅ 健康检查通过。回滚方式：在服务器执行 \`cd ${{ vars.DEPLOY_PATH || '/opt/pandora' }} && ./remote-rollback.sh\`。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
