name: CI Android

# 只在 Android 模块有改动时触发，避免后端/Web 的 PR 白跑一次 Gradle 构建。
# 若 demo/ 仍在维护，把 'demo/**' 一并加进下面的 paths。
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
  push:
    branches: [dev, main]
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android 静态检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # android/gradle/libs.versions.toml 使用 AGP 9.x，需要 JDK 17 以上，这里取 21
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # android/gradlew 在 Git 中的模式是 100644（没有可执行位），Linux runner 上必须补。
      # 根治办法（另开一个 chore PR 执行一次）：
      #   git update-index --chmod=+x android/gradlew && git commit -m "chore: 给 gradlew 加可执行位"
      - name: 修正 gradlew 执行权限
        run: chmod +x gradlew

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传测试与 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 Debug APK（供测试同学安装）
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
