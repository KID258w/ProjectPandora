name: 缺陷
description: 报告一个缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么，期望是什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 以员工角色登录
        2. 进入任务详情
        3. 点击“更新进度”
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 例如 staging / 版本号 / 机型 / 浏览器
      placeholder: staging / v0.1.0 / Android 14 / Chrome 130
    validations:
      required: true

  - type: input
    id: change
    attributes:
      label: 关联 OpenSpec change
      placeholder: add-task-assignment
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: 日志 / 截图 / 失败的工作流链接
    validations:
      required: false
